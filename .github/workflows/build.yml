name: Build
on: workflow_dispatch  
jobs:
  build:
    strategy:
      matrix:
        platform: [windows, emscripten]
        config: [dev, release]
    name: ${{matrix.platform}}-${{matrix.config}}
    runs-on: [ self-hosted, "${{matrix.platform}}" ]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true
    - name: Cleanup
      run: cmake -E rm -rf temp/build temp/install
    - name: Configure
      run: cmake --preset ${{matrix.platform}}-${{matrix.config}} -D CC_BUILD_VERSION=${{github.ref_name}} -D CC_BUILD_PLATFORM=${{matrix.platform}} -D CC_BUILD_CONFIG=${{matrix.config}} -D CC_BUILD_COMMIT=${{github.sha}} -D CC_BUILD_NUMBER=${{github.run_number}}
    - name: Build
      run: cmake --build --preset ${{matrix.platform}}-${{matrix.config}} --target install
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{github.ref_name}}+${{matrix.platform}}-${{matrix.config}}
        path: temp/install/${{matrix.platform}}-${{matrix.config}}