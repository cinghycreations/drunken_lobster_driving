<!DOCTYPE html>
<html>

<head>
    <title>Pause</title>
    <link rel="stylesheet" type="text/css" href="/ui/common.css" />
    <style>
        body {
            display: flex;
            flex-direction: column;
        }

        main {
            display: flex;
            flex: 1;
            justify-content: center;
            align-items: center;
        }

        panel {
            width: 250px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        panel>p {
            font-size: 40px;
            text-align: center;
        }

        panel>input[type=button] {
            margin: 5px;
        }
    </style>
</head>

<body>
    <main>
        <panel>
            <p>Pause</p>
            <input type="button" value="Resume" />
            <input type="button" value="Exit" />
        </panel>
    </main>
</body>

</html>
