<!DOCTYPE html>
<html>

<head>
    <title>In-game</title>
    <link rel="stylesheet" type="text/css" href="/ui/common.css" />
    <style>
        body {
            display: flex;
            flex-direction: column;
        }

        header,
        footer {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 0.5rem;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        main >p{
            font-size: 6rem;
        }

        panel {
            display: flex;
            flex-direction: column;
            padding: 0.5rem;
        }

        panel {
            padding-top: 0.25rem;
            padding-bottom: 0.25rem;
        }

        panel>p {
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
        }
    </style>
</head>

<body data-model="session">
    <header>
        <panel>
            <p data-if="currentMode == 'Sequence'">Score {{score}}</p>
            <p data-if="currentMode == 'Time Attack'">Time {{time}}</p>
        </panel>
    </header>
    <main>
        <p data-if="countdown > 0">{{countdown}}</p>
    </main>
    <footer>
        <button data-event-click="pauseSession()">Pause</button>
    </footer>
</body>

</html>
