<!DOCTYPE html>
<html>

<head>
    <title>In-game</title>
    <link rel="stylesheet" type="text/css" href="/ui/common.css" />
    <style>
        body {
            display: flex;
            flex-direction: column;
        }

        header,
        footer {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 10px;
        }

        main {
            flex: 1;
        }

        panel {
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        panel {
            padding-top: 5px;
            padding-bottom: 5px;
        }

        panel>p {
            margin-top: 5px;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <header>
        <panel>
            <p>Mayhem {{mayhem}}</p>
            <p>Speed {{speed}}</p>
        </panel>
        <panel>
            <p>Time {{time}}</p>
            <p>Score {{score}}</p>
        </panel>
    </header>
    <main>

    </main>
    <footer>
        <input type="button" value="Pause" data-event-click="pauseSession()" />
    </footer>
</body>

</html>
