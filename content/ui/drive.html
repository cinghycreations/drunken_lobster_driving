<!DOCTYPE html>
<html>

<head>
    <title>How to Play</title>
    <link rel="stylesheet" type="text/css" href="/ui/common.css" />
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        panel {
            width: 25rem;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
        }

        panel>p {
            font-size: 2rem;
            text-align: center;
        }

        button.level {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        button.level>p {
            margin: 0rem;
            padding: 0.1rem;
        }

        div.spacer {
            height: 2rem;
        }
    </style>
</head>

<body data-model="launcher">
    <panel>
        <p>Choose Level</p>
        <button data-event-click="switchMode()">Mode: {{currentMode}}</button>
        <div class="spacer"></div>
        <button class="level" data-event-click="playLevel(0)">
            <p>{{levelNames[0]}}</p>
            <p>{{levelRecords[0]}}</p>
            <p>{{levelRanks[0]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(1)">
            <p>{{levelNames[1]}}</p>
            <p>{{levelRecords[1]}}</p>
            <p>{{levelRanks[1]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(2)">
            <p>{{levelNames[2]}}</p>
            <p>{{levelRecords[2]}}</p>
            <p>{{levelRanks[2]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(3)">
            <p>{{levelNames[3]}}</p>
            <p>{{levelRecords[3]}}</p>
            <p>{{levelRanks[3]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(4)">
            <p>{{levelNames[4]}}</p>
            <p>{{levelRecords[4]}}</p>
            <p>{{levelRanks[4]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(5)">
            <p>{{levelNames[5]}}</p>
            <p>{{levelRecords[5]}}</p>
            <p>{{levelRanks[5]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(6)">
            <p>{{levelNames[6]}}</p>
            <p>{{levelRecords[6]}}</p>
            <p>{{levelRanks[6]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(7)">
            <p>{{levelNames[7]}}</p>
            <p>{{levelRecords[7]}}</p>
            <p>{{levelRanks[7]}}</p>
        </button>
        <div class="spacer"></div>
        <button data-event-click="goToHome()">Back</button>
    </panel>
</body>

</html>
