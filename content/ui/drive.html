<!DOCTYPE html>
<html>

<head>
    <title>How to Play</title>
    <link rel="stylesheet" type="text/css" href="/ui/common.css" />
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        panel {
            width: 20rem;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
        }

        panel>p {
            font-size: 2rem;
            text-align: center;
        }

        button.level {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        button.level>p {
            margin: 0rem;
            padding: 0.1rem;
        }

        div.spacer {
            height: 2rem;
        }
    </style>
</head>

<body data-model="launcher">
    <panel>
        <p>Choose Level</p>
        <button class="level" data-event-click="playLevel(0)">
            <p>1. {{levelNames[0]}}</p>
            <p>Rank: {{levelRanks[0]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(1)">
            <p>2. {{levelNames[1]}}</p>
            <p>Rank: {{levelRanks[1]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(2)">
            <p>3. {{levelNames[2]}}</p>
            <p>Rank: {{levelRanks[2]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(3)">
            <p>4. {{levelNames[3]}}</p>
            <p>Rank: {{levelRanks[3]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(4)">
            <p>5. {{levelNames[4]}}</p>
            <p>Rank: {{levelRanks[4]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(5)">
            <p>6. {{levelNames[5]}}</p>
            <p>Rank: {{levelRanks[5]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(6)">
            <p>7. {{levelNames[6]}}</p>
            <p>Rank: {{levelRanks[6]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(7)">
            <p>8. {{levelNames[7]}}</p>
            <p>Rank: {{levelRanks[7]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(8)">
            <p>9. {{levelNames[8]}}</p>
            <p>Rank: {{levelRanks[8]}}</p>
        </button>
        <button class="level" data-event-click="playLevel(9)">
            <p>10. {{levelNames[9]}}</p>
            <p>Rank: {{levelRanks[9]}}</p>
        </button>
        <div class="spacer"></div>
        <button data-event-click="goToHome()">Back</button>
    </panel>
</body>

</html>
