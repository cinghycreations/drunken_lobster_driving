<!DOCTYPE html>
<html>

<head>
    <title>How to Play</title>
    <link rel="stylesheet" type="text/css" href="/ui/common.css" />
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        panel {
            width: 20rem;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
        }

        panel>* {
            display: block;
            margin: 1rem 0rem;
        }

        div.tutorial>p {
            margin: 0rem;
        }

        div.tutorial>p>img {
            width: 1.5rem;
            margin: 0rem;
            padding: 0rem;
        }
    </style>
</head>

<body data-model="launcher">
    <panel>
        <p>Drive like a drunken lobster and destroy everything!</p>
        <div class="tutorial">
            <p>
                Sequence Mode: increase your score by destroying streaks of identical buildings like
                <img src="/buildings/garden0000.png" />
                <img src="/buildings/garden0000.png" />
                <img src="/buildings/garden0000.png" />
                or
                <img src="/buildings/gaspump0000.png" />
                <img src="/buildings/gaspump0000.png" />
                <img src="/buildings/gaspump0000.png" />
                <img src="/buildings/gaspump0000.png" />
                in a short time. Skyscrapers <img src="/buildings/skyscraper0000.png" />
                give a 2x multiplier while Nuclear plants <img src="/buildings/nuclear0000.png" />
                a 5x multiplier
            </p>
        </div>

        <div class="tutorial">
            <p>Time Attack Mode: destroy all buildings in the shortest time possible</p>
        </div>
        <button data-event-click="goToHome()">Back</button>
    </panel>
</body>

</html>
