<!DOCTYPE html>
<html>

<head>
    <title>Home</title>
    <link rel="stylesheet" type="text/css" href="/ui/common.css" />
    <style>
        body {
            display: flex;
            flex-direction: column;
        }

        main {
            display: flex;
            flex: 1;
            justify-content: center;
            align-items: center;
        }

        footer {
            display: flex;
            justify-content: space-between;
        }

        languages {
            display: flex;
            padding: 0.5rem;
            gap: 0.5rem;
        }

        panel {
            width: 20rem;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
        }

        panel>p {
            font-size: 3rem;
            text-align: center;
            margin: 2rem 0rem;
        }

        panel>button {
            margin: 0.25rem;
        }

        img {
            padding: 0.25rem;
            width: 2rem;
            height: 2rem;
        }

        img {
            border-width: 0.1rem;
            border-style: solid;
            border-color: #1e90ff;
            border-radius: 0.5rem;
            background-color: #ffe4b5;
        }

        img:hover {
            background-color: #ffd700;
        }

        copyright {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0rem 0.5rem;
        }
    </style>
</head>

<body>
    <main>
        <panel>
            <p>Drunken Lobster Driving</p>
            <button data-event-click="goToHowToPlay()">How to Play</button>
            <button data-event-click="goToDrive()">Drive</button>
            <button >Records</button>
            <button >Options</button>
            <button data-event-click="goToCredits()">Credits</button>
            <button data-event-click="quit()">Quit</button>
        </panel>
    </main>
    <footer>
        <copyright>
            <p>{{buildVersion}} built on {{buildDate}}</p>
        </copyright>
        <languages>
            <img src="/ui/italy.png" data-event-click="selectLanguageItalian()"/>
            <img src="/ui/uk.png" data-event-click="selectLanguageEnglish()"/>
            <img src="/ui/spain.png" data-event-click="selectLanguageSpanish()" />
        </languages>
    </footer>
</body>

</html>
